server {
    listen 127.0.0.1:8080;
    server_name 127.0.0.1 localhost;

    access_log off;

    location = /backend/api/graduate-auth/check.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gradtrack/backend/api/graduate-auth/check.php;
        fastcgi_param DOCUMENT_ROOT /var/www/gradtrack/backend;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
