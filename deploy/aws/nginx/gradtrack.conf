server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/gradtrack/frontend/dist;
    index index.html;
    client_max_body_size 256m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    if (-f /var/www/gradtrack/.maintenance) {
        return 503;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }

    location ~* ^/backend/api/(?:debug(?:-birthday-update)?|diagnose-survey|test-(?:admin|alignment|connection|db|db-connection|db-full)|fix-(?:birthday-by-id|birthday-type|database|survey-table)|check-birthday-field|update-birthday-field|add-(?:date-type|radio-type))\.php$ {
        return 404;
    }
    location ~* ^/backend/api/surveys/(?:migrate-[^/]+|audit-survey-address-integrity|update_examination_question|view_questions)\.php$ {
        return 404;
    }
    location = /backend/api/auth/hash_passwords.php { return 404; }
    location ^~ /backend/scripts/ { return 404; }
    location ^~ /backend/tests/ { return 404; }
    location ^~ /backend/tmp/ { return 404; }
    location ^~ /backend/vendor/ { return 404; }
    location ~ (^|/)\. { return 404; }
    location ~* ^/backend/uploads/.*\.(?:php[0-9]?|phtml|phar|cgi|pl|py|sh)$ { return 404; }

    location /backend/uploads/ {
        alias /var/www/gradtrack/backend/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/backend/(.+\.php)$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/gradtrack/backend/$1;
        fastcgi_param DOCUMENT_ROOT /var/www/gradtrack/backend;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location /backend/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
